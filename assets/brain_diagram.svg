<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%" id="brain-svg">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-pfc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-nac" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-amy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-hip" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="grad-pfc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="oklch(75% 0.18 190)" stop-opacity="0.85" />
      <stop offset="100%" stop-color="oklch(60% 0.22 210)" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="grad-nac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="oklch(65% 0.28 330)" stop-opacity="0.9" />
      <stop offset="100%" stop-color="oklch(50% 0.24 350)" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="grad-amy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="oklch(65% 0.22 30)" stop-opacity="0.9" />
      <stop offset="100%" stop-color="oklch(50% 0.20 15)" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="grad-hip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="oklch(75% 0.18 140)" stop-opacity="0.85" />
      <stop offset="100%" stop-color="oklch(55% 0.20 160)" stop-opacity="0.45" />
    </linearGradient>

    <!-- Brain Outline Glow -->
    <filter id="outline-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Interactive States and Styles inside SVG */
    .brain-part {
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .brain-part:hover {
      fill-opacity: 0.95;
      stroke-width: 3px;
      filter: url(#glow-pfc); /* Dynamic glow fallback */
    }
    .brain-part.active {
      stroke-width: 4px !important;
      fill-opacity: 0.95;
    }
    
    /* Specific Hover Glows for regions */
    #part-pfc:hover, #part-pfc.active {
      filter: url(#glow-pfc);
      stroke: oklch(85% 0.15 190);
    }
    #part-nac:hover, #part-nac.active {
      filter: url(#glow-nac);
      stroke: oklch(80% 0.20 330);
    }
    #part-amygdala:hover, #part-amygdala.active {
      filter: url(#glow-amy);
      stroke: oklch(80% 0.15 30);
    }
    #part-hippocampus:hover, #part-hippocampus.active {
      filter: url(#glow-hip);
      stroke: oklch(85% 0.15 140);
    }

    .base-brain {
      fill: none;
      stroke: oklch(40% 0.05 240);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.45;
      transition: stroke 0.3s;
    }
    
    .base-sulci {
      fill: none;
      stroke: oklch(35% 0.04 240);
      stroke-width: 1.5px;
      opacity: 0.3;
    }

    .hotspot-connector {
      fill: none;
      stroke: oklch(50% 0.05 240);
      stroke-width: 1px;
      stroke-dasharray: 4,4;
      opacity: 0.5;
    }

    .hotspot-label {
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: oklch(85% 0.05 240);
      opacity: 0.7;
      transition: opacity 0.3s, fill 0.3s;
      cursor: pointer;
    }
    
    .hotspot-label:hover, .hotspot-label.active {
      opacity: 1;
      fill: white;
    }
  </style>

  <!-- BACKGROUND GRID (Subtle Tech/Bio aesthetic) -->
  <g opacity="0.1">
    <circle cx="400" cy="275" r="240" fill="none" stroke="currentColor" stroke-dasharray="2, 8" />
    <circle cx="400" cy="275" r="160" fill="none" stroke="currentColor" stroke-dasharray="1, 5" />
    <line x1="400" y1="20" x2="400" y2="530" stroke="currentColor" stroke-dasharray="3, 10" />
    <line x1="100" y1="275" x2="700" y2="275" stroke="currentColor" stroke-dasharray="3, 10" />
  </g>

  <!-- OVERALL BRAIN OUTLINE (Cerebral Cortex shape - Facing Left) -->
  <g id="brain-cortex-outline">
    <!-- Cerebellum and Brainstem -->
    <path class="base-brain" d="M 440 370 C 420 370, 410 400, 420 460 C 425 490, 420 520, 420 520 M 450 520 C 450 520, 455 490, 450 440 C 455 410, 490 410, 500 400 C 530 380, 540 330, 500 315 C 470 305, 450 320, 440 370 Z" />
    <!-- Cerebellar folds -->
    <path class="base-sulci" d="M 450 340 C 470 335, 495 340, 505 350 M 445 365 C 470 360, 495 365, 512 368 M 448 385 C 470 380, 495 385, 505 388 M 445 405 C 465 400, 485 405, 492 408" />
    
    <!-- Main Cortex Silhouette (Facing left: Frontal lobe is Left, Occipital is Right) -->
    <path class="base-brain" filter="url(#outline-glow)" d="M 440 315 C 380 325, 340 330, 310 290 C 270 240, 260 180, 320 120 C 370 70, 480 60, 550 110 C 600 150, 615 220, 580 270 C 555 305, 515 315, 480 315" />
    
    <!-- Major Sulci / Creases for organic detail -->
    <path class="base-sulci" d="M 460 75 C 440 100, 430 140, 420 200" /> <!-- Central Sulcus -->
    <path class="base-sulci" d="M 330 180 C 380 185, 420 170, 485 210" /> <!-- Lateral Sulcus -->
    <path class="base-sulci" d="M 520 100 C 500 130, 510 160, 530 180" />
    <path class="base-sulci" d="M 380 100 C 390 120, 380 145, 360 160" />
    <path class="base-sulci" d="M 310 220 C 330 215, 350 230, 355 255" />
    <path class="base-sulci" d="M 570 170 C 550 180, 540 210, 550 240" />
    <path class="base-sulci" d="M 490 260 C 470 270, 475 290, 480 310" />
  </g>

  <!-- INTERACTIVE BRAIN REGIONS -->
  
  <!-- 1. PREFRONTAL CORTEX (PFC) - Neon Cyan/Teal (Renewal of Mind, Executive Function) -->
  <g id="group-pfc" class="brain-part-group">
    <!-- Highlight Region -->
    <path id="part-pfc" class="brain-part" 
          d="M 320 125 C 290 155, 275 190, 285 225 C 295 260, 320 275, 345 260 C 370 240, 380 215, 375 175 C 365 135, 345 120, 320 125 Z" 
          fill="url(#grad-pfc)" stroke="oklch(65% 0.18 190)" stroke-width="1.5" fill-opacity="0.65" />
    
    <!-- Hotspot connector and label -->
    <line x1="310" y1="180" x2="160" y2="120" class="hotspot-connector" />
    <circle cx="310" cy="180" r="4" fill="oklch(75% 0.18 190)" />
    <text x="145" y="115" class="hotspot-label" id="lbl-pfc" text-anchor="end">
      PREFRONTAL CORTEX (PFC)
    </text>
    <text x="145" y="132" fill="oklch(65% 0.05 240)" font-family="sans-serif" font-size="11" text-anchor="end">
      Cognitive Control &amp; Metanoia
    </text>
  </g>

  <!-- 2. HIPPOCAMPUS (Hip) - Neon Emerald (Memory, Habits, Patterns) -->
  <g id="group-hippocampus" class="brain-part-group">
    <!-- Highlight Region (Seahorse shape curving around core) -->
    <path id="part-hippocampus" class="brain-part" 
          d="M 460 210 C 430 200, 410 220, 395 245 C 385 265, 395 285, 415 285 C 440 285, 455 255, 465 240 C 475 225, 475 215, 460 210 Z" 
          fill="url(#grad-hip)" stroke="oklch(65% 0.18 140)" stroke-width="1.5" fill-opacity="0.65" />
    
    <!-- Hotspot connector and label -->
    <line x1="430" y1="250" x2="550" y2="440" class="hotspot-connector" />
    <circle cx="430" cy="250" r="4" fill="oklch(75% 0.18 140)" />
    <text x="565" y="445" class="hotspot-label" id="lbl-hippocampus" text-anchor="start">
      HIPPOCAMPUS
    </text>
    <text x="565" y="462" fill="oklch(65% 0.05 240)" font-family="sans-serif" font-size="11" text-anchor="start">
      Memory &amp; Cycle Repetition
    </text>
  </g>

  <!-- 3. NUCLEUS ACCUMBENS (NAc) - Neon Magenta (Reward Hub, Dopamine Hijack) -->
  <g id="group-nac" class="brain-part-group">
    <!-- Highlight Region (Small core sphere) -->
    <circle id="part-nac" class="brain-part" cx="390" cy="225" r="16" 
            fill="url(#grad-nac)" stroke="oklch(60% 0.25 330)" stroke-width="1.5" fill-opacity="0.75" />
    
    <!-- Hotspot connector and label -->
    <line x1="390" y1="225" x2="240" y2="400" class="hotspot-connector" />
    <circle cx="390" cy="225" r="4" fill="oklch(65% 0.25 330)" />
    <text x="225" y="405" class="hotspot-label" id="lbl-nac" text-anchor="end">
      NUCLEUS ACCUMBENS
    </text>
    <text x="225" y="422" fill="oklch(65% 0.05 240)" font-family="sans-serif" font-size="11" text-anchor="end">
      Dopamine &amp; Habit Loops
    </text>
  </g>

  <!-- 4. AMYGDALA (Amy) - Fiery Amber/Orange (Fear center, Anxiety, Ruts) -->
  <g id="group-amygdala" class="brain-part-group">
    <!-- Highlight Region (Almond shape) -->
    <path id="part-amygdala" class="brain-part" 
          d="M 375 255 C 365 250, 355 258, 355 268 C 355 278, 368 285, 375 280 C 382 275, 385 262, 375 255 Z" 
          fill="url(#grad-amy)" stroke="oklch(60% 0.20 30)" stroke-width="1.5" fill-opacity="0.75" />
    
    <!-- Hotspot connector and label -->
    <line x1="368" y1="268" x2="520" y2="150" class="hotspot-connector" />
    <circle cx="368" cy="268" r="4" fill="oklch(65% 0.20 30)" />
    <text x="535" y="145" class="hotspot-label" id="lbl-amygdala" text-anchor="start">
      AMYGDALA
    </text>
    <text x="535" y="162" fill="oklch(65% 0.05 240)" font-family="sans-serif" font-size="11" text-anchor="start">
      Anxiety &amp; Amygdala Hijack
    </text>
  </g>
</svg>
